<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

    <!-- Music -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Floating Hearts -->
    <div id="hearts-container"></div>

    <div id="game-container">

        <!-- Carousel -->
        <div class="carousel">
            <img src="slide1.jpeg" class="carousel-img active">
            <img src="slide2.jpeg" class="carousel-img">
            <img src="slide3.jpeg" class="carousel-img">
            <img src="slide4.jpeg" class="carousel-img">
        </div>

        <canvas id="gameCanvas"></canvas>

        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1>Catch the Love!</h1>
            <p>Catch enough hearts to reveal a special question...</p>
            <button id="start-btn" class="btn">Start Game</button>
        </div>

        <!-- Proposal Screen -->
        <div id="proposal-screen" class="screen hidden">
            <div class="proposal-content">
                <h1></h1>
                <p class="sub-text">You caught my heart! Now I have to ask...</p>
                <div class="buttons">
                    <button id="yes-btn" class="btn yes-btn">YES!</button>
                    <button id="no-btn" class="btn no-btn">No</button>
                </div>
            </div>
        </div>

        <!-- Celebration -->
        <div id="celebration-screen" class="screen hidden">
            <h1>Happy Propose Day! 💍</h1>
            <p>I love you forever ❤️</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
